name: Build kernel vili (NetHunter)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ARGS: >-
    O=out ARCH=arm64
    CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14
    OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14
    READELF=llvm-readelf-14 STRIP=llvm-strip-14
    HOSTCC=clang-14 HOSTCXX=clang++-14 HOSTAR=llvm-ar-14 HOSTLD=ld.lld-14
    CLANG_TRIPLE=aarch64-linux-gnu-
    CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ------------------------------------------------------------------ surse
      - name: Checkout repo (workflow + vili_defconfig)
        uses: actions/checkout@v4

      - name: Checkout sursa kernel MiCode (vili-r-oss)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: vili-r-oss
          path: kernel
          fetch-depth: 1

      - name: Checkout selectiv sursa secundara (DTS/display + dt-bindings)
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            -b lineage-24.0 \
            https://github.com/Spanish-or-Vanish/kernel_xiaomi_sm8350.git fork
          cd fork
          git sparse-checkout set arch/arm64/boot/dts/vendor/qcom include/dt-bindings
          cd ..
          cp -rn fork/arch/arm64/boot/dts/vendor/qcom/. kernel/arch/arm64/boot/dts/vendor/qcom/
          cp -rf fork/include/dt-bindings/. kernel/include/dt-bindings/

      - name: Repara symlink-urile rupte din techpack (layout AOSP kernel/msm-5.4)
        run: |
          cd kernel
          reparate=0
          while IFS= read -r link; do
            tinta="$(readlink "$link")" || continue
            cale="${tinta#*kernel/msm-5.4/}"
            [ "$cale" = "$tinta" ] && continue
            if [ -e "$cale" ]; then
              rm -f "$link"
              cp -f "$cale" "$link"
              reparate=$((reparate + 1))
            else
              echo "NU AM GASIT: $cale  (pentru $link)"
            fi
          done < <(find . -xtype l)
          echo "=== symlink-uri reparate: $reparate ==="
          echo "=== rupte ramase: $(find . -xtype l | wc -l) ==="

      # -------------------------------------------------------------- dependinte
      - name: Instaleaza dependintele
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex build-essential libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip zip unzip cpio kmod rsync git curl ca-certificates \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ------------------------------------------------------------------ config
      - name: Pregatire config (normalizare UTF-16 -> UTF-8 + optiuni obligatorii)
        run: |
          set -e
          cd kernel

          SRC_DEF=""
          for p in ../vili_defconfig ../config/vili_defconfig vili_defconfig; do
            if [ -f "$p" ]; then SRC_DEF="$p"; break; fi
          done
          [ -n "$SRC_DEF" ] || { echo "NU GASESC vili_defconfig in repo"; exit 1; }
          echo "defconfig sursa: $SRC_DEF"

          if head -c 2 "$SRC_DEF" | od -An -tx1 | grep -qi 'ff fe'; then
            iconv -f UTF-16LE -t UTF-8 "$SRC_DEF" > /tmp/dc.raw
          elif head -c 2 "$SRC_DEF" | od -An -tx1 | grep -qi 'fe ff'; then
            iconv -f UTF-16BE -t UTF-8 "$SRC_DEF" > /tmp/dc.raw
          else
            cp "$SRC_DEF" /tmp/dc.raw
          fi
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' /tmp/dc.raw | tr -d '\000' > /tmp/dc.clean
          grep -q '^CONFIG_' /tmp/dc.clean || cp "$SRC_DEF" /tmp/dc.clean

          install -m 644 /tmp/dc.clean arch/arm64/configs/vili_defconfig
          echo "linii in defconfig: $(wc -l < arch/arm64/configs/vili_defconfig)"

          make $ARGS vili_defconfig

          # sterge AMBELE forme (CONFIG_X=... si "# CONFIG_X is not set") ca sa nu
          # ramana duplicate -> fara warning-uri "override: reassigning"
          add_cfg() {
            local sym="${1%%=*}"
            local val="${1#*=}"
            sed -i -e "/^${sym}=/d" -e "/^# ${sym} is not set/d" out/.config
            printf '%s=%s\n' "$sym" "$val" >> out/.config
          }

          # --- gate-uri obligatorii: fara ele simbolurile de mai jos NU EXISTA
          add_cfg CONFIG_WLAN=y
          add_cfg CONFIG_WLAN_VENDOR_ATH=y
          add_cfg CONFIG_WLAN_VENDOR_REALTEK=y
          add_cfg CONFIG_CFG80211=y
          add_cfg CONFIG_MAC80211=y
          add_cfg CONFIG_USB_SUPPORT=y
          add_cfg CONFIG_DEBUG_FS=y

          # --- drivere
          add_cfg CONFIG_ATH9K_HTC=m
          add_cfg CONFIG_ATH9K_HTC_DEBUGFS=y
          add_cfg CONFIG_RTL8187=m
          add_cfg CONFIG_EEPROM_93CX6=m

          # --- restul
          add_cfg CONFIG_RTC_LIB=y
          add_cfg CONFIG_BUILD_ARM64_DT_OVERLAY=y
          add_cfg CONFIG_OF_OVERLAY=y
          add_cfg CONFIG_MODULES=y
          add_cfg CONFIG_MODULE_SIG=n
          add_cfg 'CONFIG_LOCALVERSION="-qgki-g4d120346d9d9"'

          make $ARGS olddefconfig

      - name: Verificare config (ne-fatal)
        run: |
          cd kernel
          echo "=== stare simboli ==="
          for o in CONFIG_WLAN CONFIG_WLAN_VENDOR_ATH CONFIG_WLAN_VENDOR_REALTEK \
                   CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_USB CONFIG_USB_SUPPORT \
                   CONFIG_ATH9K_HTC CONFIG_ATH9K_HTC_DEBUGFS CONFIG_RTL8187 \
                   CONFIG_EEPROM_93CX6 CONFIG_RTC_LIB CONFIG_MODULES \
                   CONFIG_BUILD_ARM64_DT_OVERLAY CONFIG_OF_OVERLAY CONFIG_LOCALVERSION; do
            printf '%-34s %s\n' "$o" "$(grep -E "^${o}=" out/.config || echo '*** LIPSA ***')"
          done

          echo
          echo "=== diagnostic Kconfig (dependinte) ==="
          ls -d drivers/net/wireless/ath/ath9k drivers/net/wireless/realtek/rtl818x/rtl8187 2>&1
          sed -n '/^config ATH9K_HTC$/,/^config /p' drivers/net/wireless/ath/ath9k/Kconfig | head -8
          sed -n '/^config RTL8187$/,/^config /p' drivers/net/wireless/realtek/rtl818x/Kconfig | head -6
          echo "MAC80211 definit: $(grep -c '^config MAC80211$' net/mac80211/Kconfig)"

          echo
          echo "=== verdicte ==="
          for o in CONFIG_WLAN CONFIG_WLAN_VENDOR_ATH CONFIG_WLAN_VENDOR_REALTEK \
                   CONFIG_ATH9K_HTC CONFIG_RTL8187; do
            grep -q "^${o}=" out/.config || echo "AVERTISMENT: $o lipseste"
          done
          echo "gata (ne-fatal, build-ul ruleaza oricum)"

      # ------------------------------------------------------------------- build
      - name: Build kernel
        if: always()
        run: |
          cd kernel
          export KCFLAGS="-Wno-error -I$PWD/techpack/audio/include -I$PWD/drivers/pinctrl -I$PWD/techpack/audio -I$PWD/drivers/soundwire"
          echo "KCFLAGS=$KCFLAGS"
          make $ARGS -j"$(nproc)" -k 2>&1 | tee build.log || true
          echo "--- erori gasite: $(grep -c 'error:' build.log || true) ---"
          grep -n "error:" build.log | head -40 || true

      # ---------------------------------------------------------------- artefact
      - name: Colectare artefacte
        if: always()
        run: |
          cd kernel
          rm -rf ../artifact
          mkdir -p ../artifact/modules ../artifact/firmware

          if [ -f out/arch/arm64/boot/Image ]; then
            cp -v out/arch/arm64/boot/Image ../artifact/
          else
            echo "LIPSA Image"
          fi

          cp -v out/arch/arm64/boot/lahaina.dtb ../artifact/ 2>/dev/null || echo "LIPSA lahaina.dtb"
          cp -v out/arch/arm64/boot/dts/vendor/qcom/*.dtbo ../artifact/ 2>/dev/null || true

          find out -name '*.ko' -exec cp -v {} ../artifact/modules/ \;
          echo "total .ko: $(ls ../artifact/modules | wc -l)"
          echo "dtbo: $(ls ../artifact/*.dtbo 2>/dev/null | wc -l)"

          fwok=0
          for u in \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/htc_9271.fw" \
            "https://raw.githubusercontent.com/RPi-Distro/firmware-nonfree/master/htc_9271.fw" \
            "https://raw.githubusercontent.com/armbian/firmware/master/htc_9271.fw"; do
            if curl -fsSL -o /tmp/htc.fw "$u" && [ "$(stat -c%s /tmp/htc.fw 2>/dev/null || echo 0)" -gt 10000 ]; then
              cp /tmp/htc.fw ../artifact/firmware/htc_9271.fw
              echo "fw descarcat din: $u"
              fwok=1
              break
            fi
          done
          [ "$fwok" = "1" ] || echo "AVERTISMENT: fw htc_9271 nu s-a descarcat"

          du -sh ../artifact

      - name: Verificare artefacte
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          ok=1
          [ -s artifact/Image ]                            || { echo "LIPSA Image"; ok=0; }
          [ -s artifact/lahaina.dtb ]                      || { echo "LIPSA lahaina.dtb"; ok=0; }
          ls artifact/*vili*overlay*.dtbo >/dev/null 2>&1  || { echo "LIPSA vili-sm8350-overlay.dtbo"; ok=0; }
          [ -s artifact/modules/ath9k_htc.ko ]             || { echo "LIPSA ath9k_htc.ko"; ok=0; }
          [ -s artifact/modules/rtl8187.ko ]               || { echo "LIPSA rtl8187.ko"; ok=0; }
          echo "--- continut artifact ---"
          ls -lR artifact | head -80
          [ "$ok" = "1" ] || { echo "BUILD INCOMPLET"; exit 1; }
          echo "OK: artefact complet"

      - name: Upload artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vili-kernel
          path: artifact/
          if-no-files-found: warn
