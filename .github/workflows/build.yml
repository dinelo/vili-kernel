name: Build kernel vili (NetHunter)

# ---------------------------------------------------------------------------
# Kernel custom pentru Xiaomi 11T Pro (vili, sm8350, 5.4.86-qgki-g4d120346d9d9),
# ABI-compatibil cu modulele vendor stock (MIUI V12.5.10.0.RKDMIXM).
#
#  * Config: EXACT config/stock.config (/proc/config.gz stock) + doar driverele
#    NetHunter ca module (ath9k_htc + dependinte, rtl8187).
#  * Toolchain: AOSP clang r383902b1 (clang 11.0.2), acelasi ca la Xiaomi.
#  * Sursa: MiCode vili-r-oss + headerele stock din IKHEADERS (xiaomi/stock-headers):
#    sursa OSS nu are campurile Xiaomi MIGT/PACKAGE_RUNTIME_INFO din task_struct ->
#    fara ele toate CRC-urile care ating task_struct difera (bootloop).
#  * Gate CRC: Module.symvers trebuie sa se potriveasca cu config/stock_crcs.txt
#    (module_layout 0x72769acb). Altfel job-ul pica.
#  * Doar Image (fara dtbs) -> AnyKernel3 kernel-only (split_boot/flash_boot).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLANG_DIR: /opt/clang-r383902b1
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz
  # sufixul git al kernelului stock; CONFIG_LOCALVERSION="-qgki" + AUTO=y raman ca in stock
  SCMVERSION: "-g4d120346d9d9"
  EXPECTED_RELEASE: "5.4.86-qgki-g4d120346d9d9"

jobs:
  build:
    name: Build kernel vili
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout sursa kernel MiCode (vili-r-oss)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: vili-r-oss
          path: kernel
          fetch-depth: 1

      - name: Checkout driver mainline 5.4.86 (ath9k_htc)
        uses: actions/checkout@v4
        with:
          repository: gregkh/linux
          ref: v5.4.86
          path: mainline
          fetch-depth: 1

      - name: Instaleaza dependintele
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex build-essential libssl-dev libelf-dev libncurses-dev \
            python3 zip unzip cpio kmod rsync git curl ca-certificates \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Cache AOSP clang r383902b1
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: /opt/clang-r383902b1
          key: aosp-clang-r383902b1-v1

      - name: Descarca AOSP clang r383902b1 (clang 11.0.2, ca stock)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p "$CLANG_DIR" && sudo chown "$USER" "$CLANG_DIR"
          for i in 1 2 3; do
            curl -fL --retry 3 -o /tmp/clang.tgz "$CLANG_URL" && break
            sleep 20
          done
          tar -xzf /tmp/clang.tgz -C "$CLANG_DIR"
          rm -f /tmp/clang.tgz

      - name: Verifica toolchain
        run: |
          set -euo pipefail
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version | head -1
          "$CLANG_DIR/bin/clang" --version | head -1 | grep -q 'r383902b1' || { echo 'EROARE: clang gresit'; exit 1; }

      - name: Repara symlink-urile techpack (shim kernel/msm-5.4)
        run: |
          set -e
          cd kernel
          ln -sfn . msm-5.4
          reparate=0
          while IFS= read -r link; do
            tinta="$(readlink "$link")" || continue
            cale="${tinta#*kernel/msm-5.4/}"
            [ "$cale" = "$tinta" ] && continue
            if [ -e "$cale" ]; then
              rm -f "$link"; cp -f "$cale" "$link"; reparate=$((reparate+1))
            else
              echo "NU AM GASIT: $cale (pentru $link)"
            fi
          done < <(find . -path ./msm-5.4 -prune -o -xtype l -print 2>/dev/null)
          echo "=== symlink-uri copiate: $reparate ==="

      - name: Aplica ABI-ul stock Xiaomi (headere IKHEADERS + Kconfig stubs + simboluri)
        run: |
          set -euo pipefail
          cd kernel
          # 1) headerele din kernelul stock (task_struct/user_struct cu MIGT/PACKAGE_RUNTIME_INFO)
          ( cd ../xiaomi/stock-headers && find . -type f ) | while read -r f; do
            install -D -m644 "../xiaomi/stock-headers/$f" "$f"; echo "stock header: $f"
          done
          # 2) Kconfig stubs pentru optiunile Xiaomi lipsa din sursa OSS
          cp ../xiaomi/Kconfig.xiaomi init/Kconfig.xiaomi
          grep -q 'init/Kconfig.xiaomi' init/Kconfig || echo 'source "init/Kconfig.xiaomi"' >> init/Kconfig
          # 3) CONFIG_DEBUG_POWER_MI foloseste qrtr_first_msg definit in cod Xiaomi nepublicat
          if grep -q 'extern int qrtr_first_msg' net/qrtr/qrtr.h && \
             ! grep -rqE '^int qrtr_first_msg' net/ kernel/ drivers/ 2>/dev/null; then
            printf '\n#ifdef CONFIG_DEBUG_POWER_MI\nint qrtr_first_msg = 1;\n#endif\n' >> net/qrtr/qrtr.c
            echo "definit qrtr_first_msg"
          fi
          # 4) exporturi Xiaomi nepublicate cerute de qti_battery_charger_main.ko (CRC = stock)
          cp ../xiaomi/xiaomi_abi_stubs.c kernel/xiaomi_abi_stubs.c
          grep -q 'xiaomi_abi_stubs.o' kernel/Makefile || echo 'obj-y += xiaomi_abi_stubs.o' >> kernel/Makefile
          # 5) release identic cu stock: setlocalversion citeste .scmversion (fara "+")
          printf '%s' "$SCMVERSION" > .scmversion

      - name: Adauga ath9k_htc (din mainline 5.4.86)
        run: |
          set -e
          ML="$GITHUB_WORKSPACE/mainline/drivers/net/wireless"
          WL="$GITHUB_WORKSPACE/kernel/drivers/net/wireless"
          if [ ! -d "$WL/ath/ath9k" ]; then
            mkdir -p "$WL/ath"
            cp -rn "$ML/ath/." "$WL/ath/"
          fi
          # ath9k_htc face "select MAC80211_LEDS"; stock are MAC80211_LEDS=n (mac80211 built-in).
          # Codul LED din ath9k e sub #ifdef CONFIG_MAC80211_LEDS, deci scoatem select-ul.
          sed -i '/^config ATH9K_HTC$/,/^config /{/select MAC80211_LEDS/d}' "$WL/ath/ath9k/Kconfig"
          cd "$WL"
          grep -q 'wireless/ath/Kconfig'  Kconfig  || echo 'source "drivers/net/wireless/ath/Kconfig"'       >> Kconfig
          grep -q 'WLAN_VENDOR_ATH'       Makefile || echo 'obj-$(CONFIG_WLAN_VENDOR_ATH) += ath/'           >> Makefile
          echo "ath9k prezent: $(ls -d "$WL/ath/ath9k" 2>/dev/null || echo NU)"
          grep -n -A8 '^config ATH9K_HTC$' "$WL/ath/ath9k/Kconfig"

      - name: Config = stock.config + module NetHunter
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p out
          cp ../config/stock.config out/.config
          set_cfg() {
            local sym="${1%%=*}"; sym="${sym#\# }"; sym="${sym%% *}"
            sed -i -e "/^${sym}=/d" -e "/^# ${sym} is not set/d" out/.config
            printf '%s\n' "$1" >> out/.config
          }
          # doar bool-uri de vizibilitate + drivere ca module (nu schimba structuri core)
          set_cfg 'CONFIG_WLAN_VENDOR_ATH=y'
          set_cfg 'CONFIG_ATH_COMMON=m'
          set_cfg 'CONFIG_ATH9K_HW=m'
          set_cfg 'CONFIG_ATH9K_COMMON=m'
          set_cfg 'CONFIG_ATH9K_HTC=m'
          # stock nu are RELR (toolchain-ul Xiaomi nu l-a detectat) -> il tinem oprit
          set_cfg '# CONFIG_RELR is not set'
          make $ARGS olddefconfig
          set_cfg '# CONFIG_RELR is not set'
          make $ARGS olddefconfig
          echo "=== diferente fata de stock.config ==="
          diff <(grep -E '^(CONFIG_|# CONFIG_)' ../config/stock.config | sort) \
               <(grep -E '^(CONFIG_|# CONFIG_)' out/.config | sort) | tee ../config.diff || true
          for o in CONFIG_MIGT CONFIG_PACKAGE_RUNTIME_INFO CONFIG_MODVERSIONS CONFIG_LTO_CLANG CONFIG_CFI_CLANG \
                   CONFIG_ATH9K_HTC CONFIG_MAC80211_LEDS CONFIG_LOCALVERSION CONFIG_LOCALVERSION_AUTO CONFIG_RELR; do
            printf '%-30s %s\n' "$o" "$(grep -E "^${o}=|^# ${o} is not set" out/.config || echo LIPSA)"
          done
          grep -q '^CONFIG_ATH9K_HTC=m' out/.config || { echo 'EROARE: ath9k_htc nu e modul'; exit 1; }
          grep -q '^CONFIG_MIGT=y' out/.config || { echo 'EROARE: CONFIG_MIGT pierdut'; exit 1; }
          # nimic built-in (=y) nou fata de stock, in afara de bool-uri de meniu WLAN / ath9k-only / detectie toolchain
          extra=$(diff <(grep -E '^CONFIG_[A-Z0-9_]+=y' ../config/stock.config | sort) \
                       <(grep -E '^CONFIG_[A-Z0-9_]+=y' out/.config | sort) | grep '^>' \
                  | grep -vE 'CONFIG_(WLAN_VENDOR_ATH|ATH9K_BTCOEX_SUPPORT|TOOLS_SUPPORT_RELR)=y' || true)
          [ -z "$extra" ] || { echo "EROARE: optiuni built-in noi fata de stock:"; echo "$extra"; exit 1; }
        env:
          ARGS: O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld HOSTCC=gcc HOSTCXX=g++ CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # Compilam DOAR Image + modules (NU dtbs) -> pastram DTB/DTBO stock.
      - name: Build kernel (Image + module)
        run: |
          set -euo pipefail
          cd kernel
          export KCFLAGS="-Wno-error -I$PWD/techpack/audio/include -I$PWD/drivers/pinctrl -I$PWD/techpack/audio -I$PWD/drivers/soundwire"
          command -v llvm-nm
          make $ARGS -j"$(nproc)" Image modules 2>&1 | tee build.log
          echo "--- erori: $(grep -c 'error:' build.log || true) | 'not found': $(grep -c 'not found' build.log || true) | version generation failed: $(grep -c 'version generation failed' build.log || true) ---"
          test -s out/arch/arm64/boot/Image || { echo 'EROARE: Image lipsa dupa make'; exit 1; }
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          [ "$REL" = "$EXPECTED_RELEASE" ] || { echo "EROARE: release '$REL' != $EXPECTED_RELEASE"; exit 1; }
        env:
          ARGS: O=out ARCH=arm64 LLVM=1 CC=clang LD=ld.lld HOSTCC=gcc HOSTCXX=g++ CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # Gate pentru varianta FALLBACK (inlocuire kernel). Nu blocheaza modulul Magisk.
      - name: Gate CRC kernel vs modulele vendor stock (fallback)
        id: kgate
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifact/kernel-fallback
          cp kernel/out/Module.symvers artifact/kernel-fallback/Module.symvers
          cp kernel/out/.config artifact/kernel-fallback/kernel.config
          cp config.diff artifact/kernel-fallback/config.diff 2>/dev/null || true
          echo "===== GATE 1: 1020 CRC-uri (msm_drm, cnss2, camera) ====="
          python3 ci/crc_gate.py config/stock_crcs.txt kernel/out/Module.symvers artifact/kernel-fallback/crc_report.txt kernel/out config/stock_exports.txt
          echo "===== GATE 2: toate cele 110 module din /vendor/lib/modules (simboluri din kernel) ====="
          # mi_memory.ko (info memorie Xiaomi, necritic) cere exporturi UFS/memblock private Xiaomi
          CRC_ALLOW_MISSING=get_ufs_data,get_ufs_hba_data,get_ufs_sdev_data,memblock_mem_size_in_gb,ufs_get_string_desc,ufs_read_desc_param,ufshcd_read_desc \
            python3 ci/crc_gate.py config/stock_vendor_crcs.txt kernel/out/Module.symvers artifact/kernel-fallback/crc_report_all_vendor.txt

      # CALEA PRINCIPALA: doar modulele ath9k_htc pe kernelul STOCK (fara inlocuire kernel).
      - name: Gate module ath9k_htc vs kernelul STOCK (CRC + module_layout + vermagic)
        run: |
          set -euo pipefail
          mkdir -p artifact/magisk-src/lib
          for m in ath ath9k_hw ath9k_common ath9k_htc; do
            f=$(find kernel/out/drivers/net/wireless/ath -name "$m.ko" | head -1)
            [ -n "$f" ] || { echo "LIPSA $m.ko"; exit 1; }
            cp -v "$f" artifact/magisk-src/lib/
          done
          # strip debug info (pastreaza __versions/.modinfo/simboluri)
          for k in artifact/magisk-src/lib/*.ko; do llvm-strip --strip-debug "$k"; done
          python3 ci/ko_gate.py config/stock_kernel_crcs.txt \
            "5.4.86-qgki-g4d120346d9d9 SMP preempt mod_unload modversions aarch64" \
            artifact/ko_gate_report.txt artifact/magisk-src/lib/*.ko

      - name: Modul Magisk AR9271 (ath9k_htc + firmware)
        run: |
          set -euo pipefail
          D=artifact/magisk-src
          cp -r magisk/. "$D/"
          LF="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
          mkdir -p "$D/firmware/ath9k_htc" "$D/system/vendor/firmware/ath9k_htc"
          curl -fsSL -o "$D/firmware/ath9k_htc/htc_9271-1.4.0.fw" "$LF/ath9k_htc/htc_9271-1.4.0.fw"
          curl -fsSL -o "$D/firmware/htc_9271.fw" "$LF/htc_9271.fw"
          for f in ath9k_htc/htc_9271-1.4.0.fw htc_9271.fw; do
            [ "$(stat -c%s "$D/firmware/$f")" -gt 10000 ] || { echo "firmware $f invalid"; exit 1; }
            cp "$D/firmware/$f" "$D/system/vendor/firmware/$f"
          done
          (cd "$D" && zip -r9 ../AR9271-ath9k_htc-vili-stock-magisk.zip . -x '.git*')
          unzip -l artifact/AR9271-ath9k_htc-vili-stock-magisk.zip
          ls -l artifact/AR9271-ath9k_htc-vili-stock-magisk.zip

      - name: Pregateste AnyKernel3 (kernel-only, vili) - doar daca gate-ul kernel a trecut
        if: steps.kgate.outcome == 'success'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/modules ak3/ramdisk ak3/patch ak3/README.md
          cat > ak3/anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script - vili (Xiaomi 11T Pro)
          ## kernel-only replacement: pastreaza ramdisk-ul (Magisk), dtb/dtbo stock

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=NetHunter kernel vili (stock ABI 5.4.86-qgki-g4d120346d9d9)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install: doar kernelul (Image), fara unpack/repack de ramdisk
          split_boot;
          flash_boot;
          ## end boot install
          AK3
          sed -i 's/^          //' ak3/anykernel.sh
          echo "=== anykernel.sh ==="; cat ak3/anykernel.sh
          grep -q 'omap\|tuna' ak3/anykernel.sh && { echo 'EROARE: anykernel.sh generic'; exit 1; } || true

      - name: Colectare Image (fallback)
        if: always()
        run: |
          mkdir -p artifact/kernel-fallback
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp -v kernel/out/arch/arm64/boot/Image artifact/kernel-fallback/Image
            [ -d ak3 ] && cp -v kernel/out/arch/arm64/boot/Image ak3/Image || true
          fi

      - name: Impacheteaza zip-ul AnyKernel3 (fallback)
        if: steps.kgate.outcome == 'success'
        run: |
          cd ak3
          [ -f Image ] || { echo "Nu exista Image"; exit 1; }
          zip -r9 ../artifact/kernel-fallback/AnyKernel3-vili-nethunter.zip . -x '.git*'
          unzip -l ../artifact/kernel-fallback/AnyKernel3-vili-nethunter.zip

      - name: Verificare artefacte
        if: always()
        run: |
          ls -lR artifact | grep -v '^$' | head -80
          [ -s artifact/AR9271-ath9k_htc-vili-stock-magisk.zip ] || { echo 'LIPSA zip Magisk'; exit 1; }
          echo "gate kernel (fallback): ${{ steps.kgate.outcome }}"

      - name: Salveaza build.log
        if: always()
        run: mkdir -p artifact && cp kernel/build.log artifact/build.log 2>/dev/null || true

      - name: Upload artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vili-nethunter-kernel
          path: artifact/
          if-no-files-found: warn
