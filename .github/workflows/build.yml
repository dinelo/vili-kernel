name: Build vili NetHunter kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instaleaza dependinte
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu zip kmod curl

      - name: Cloneaza sursa Xiaomi
        run: |
          git clone --depth 1 -b vili-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Cloneaza mainline 5.4.86
        run: |
          git clone --depth 1 -b v5.4.86 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git mainline

      - name: Cloneaza dtsi-urile lipsa
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Spanish-or-Vanish/kernel_xiaomi_sm8350.git sm8350tree
          cd sm8350tree
          git sparse-checkout set arch/arm64/boot/dts/vendor/qcom
          cd ..
          du -sh sm8350tree

      - name: Descarca firmware ath9k_htc
        run: |
          mkdir -p firmware
          curl -fL -o firmware/htc_9271-1.4.0.fw \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw"
          curl -fL -o firmware/htc_7010-1.4.0.fw \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_7010-1.4.0.fw"
          ls -la firmware/

      - name: Adauga driverele ath9k_htc si rtl8187
        run: |
          set -e
          ML="$GITHUB_WORKSPACE/mainline/drivers/net/wireless"
          WL="$GITHUB_WORKSPACE/kernel/drivers/net/wireless"
          cp -r "$ML/ath" "$WL/"
          mkdir -p "$WL/realtek"
          cp -r "$ML/realtek/rtl818x" "$WL/realtek/"
          cd "$WL"
          grep -q 'wireless/ath/Kconfig' Kconfig || echo 'source "drivers/net/wireless/ath/Kconfig"' >> Kconfig
          grep -q 'WLAN_VENDOR_ATH' Makefile || echo 'obj-$(CONFIG_WLAN_VENDOR_ATH) += ath/' >> Makefile
          grep -q 'realtek/rtl818x/Kconfig' Kconfig || echo 'source "drivers/net/wireless/realtek/rtl818x/Kconfig"' >> Kconfig
          touch realtek/Makefile
          grep -q 'rtl818x' realtek/Makefile || printf 'obj-$(CONFIG_RTL8180) += rtl818x/\nobj-$(CONFIG_RTL8187) += rtl818x/\n' >> realtek/Makefile
          grep -q 'realtek/' Makefile || echo 'obj-$(CONFIG_WLAN_VENDOR_REALTEK) += realtek/' >> Makefile

      - name: Completeaza dts-urile lipsa
        run: |
          SRCQ="$GITHUB_WORKSPACE/sm8350tree/arch/arm64/boot/dts/vendor/qcom"
          DSTQ="$GITHUB_WORKSPACE/kernel/arch/arm64/boot/dts/vendor/qcom"
          echo "=== subfoldere lipsa in sursa Xiaomi ==="
          for d in "$SRCQ"/*/; do
            name=$(basename "$d")
            if [ ! -d "$DSTQ/$name" ]; then
              echo "copiez: $name"
              cp -rn "$d" "$DSTQ/"
            else
              echo "exista deja: $name"
            fi
          done
          echo "=== continut dupa completare ==="
          ls -la "$DSTQ" | head -30
          echo "=== verificare lahaina-sde.dtsi ==="
          ls -la "$DSTQ/display/lahaina-sde.dtsi" || echo "LIPSA!"

      - name: Normalizeaza config-ul
        run: |
          set -e
          if file vili_defconfig | grep -qi 'UTF-16'; then
            iconv -f UTF-16LE -t UTF-8 vili_defconfig > vili_utf8
            mv vili_utf8 vili_defconfig
          fi
          sed -i '1s/^\xEF\xBB\xBF//' vili_defconfig
          sed -i 's/\r$//' vili_defconfig
          file vili_defconfig
          echo "linii CONFIG active: $(grep -c '^CONFIG_' vili_defconfig)"
          sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION="-qgki-g4d120346d9d9"|' vili_defconfig
          sed -i 's|^CONFIG_LOCALVERSION_AUTO=y|# CONFIG_LOCALVERSION_AUTO is not set|' vili_defconfig
          sed -i 's|^CONFIG_MODVERSIONS=y|CONFIG_MODVERSIONS=n|' vili_defconfig
          cat >> vili_defconfig <<'EOF'
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH9K_HTC_DEBUGFS=y
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH_COMMON=m
          CONFIG_RTL8187=m
          CONFIG_EEPROM_93CX6=m
          CONFIG_AVERAGE=y
          CONFIG_CRC_CCITT=y
          CONFIG_RTC_LIB=y
          EOF

      - name: Build
        run: |
          cd kernel
          export PATH=/usr/lib/llvm-14/bin:$PATH
          export ARCH=arm64
          ARGS="ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          mkdir -p out
          cp ../vili_defconfig out/.config
          make O=out $ARGS olddefconfig
          echo "=== config final: $(wc -l < out/.config) linii ==="
          echo "=== compilare (cu -k, nu se opreste la dtb-uri rupte) ==="
          make -j$(nproc) O=out $ARGS -k || true
          echo "=== verificare artefacte ==="
          echo "--- kernel:"
          ls -la out/arch/arm64/boot/Image* 2>/dev/null || echo "LIPSA Image"
          echo "--- dtb/dtbо vili:"
          find out/arch/arm64/boot/dts -iname "*vili*" 2>/dev/null || echo "LIPSA"
          echo "--- module wireless:"
          find out -name "ath9k_htc.ko" -o -name "rtl8187.ko" 2>/dev/null || echo "LIPSA"
          echo "--- total .ko: $(find out -name '*.ko' | wc -l)"

      - name: Verifica vermagic
        run: |
          cd kernel
          find out -name "ath9k_htc.ko" -o -name "rtl8187.ko" | while read m; do
            echo "--- $m"; modinfo "$m" | grep -i vermagic || true
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/**/*.dtb
            kernel/out/arch/arm64/boot/dts/**/*.dtbo
            kernel/out/drivers/net/wireless/**/*.ko
            firmware/*.fw
