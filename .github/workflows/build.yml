name: Build kernel vili

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instaleaza dependinte
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential git zip python3 device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang-14 lld-14 llvm-14 libc6-dev-i386 cpio kmod rsync

      - name: Clone sursa kernel
        run: |
          set -e
          git clone --depth 1 --branch vili-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource kernel
          cd kernel
          echo "commit sursa: $(git rev-parse --short HEAD)"

      - name: Aduce fisierele lipsa din fork
        run: |
          set -e
          git clone --filter=blob:none --sparse --depth 1 \
            --branch lineage-24.0 \
            https://github.com/Spanish-or-Vanish/kernel_xiaomi_sm8350 fork
          cd fork
          git sparse-checkout set arch/arm64/boot/dts/vendor/qcom include/dt-bindings
          cd ..
          cp -rn fork/arch/arm64/boot/dts/vendor/qcom/. kernel/arch/arm64/boot/dts/vendor/qcom/
          cp -rf fork/include/dt-bindings/. kernel/include/dt-bindings/
          echo "=== display/ ==="
          ls kernel/arch/arm64/boot/dts/vendor/qcom/display/ | wc -l
          echo "=== GCC_EDP_CLKREF_EN in header ==="
          grep -c GCC_EDP_CLKREF_EN kernel/include/dt-bindings/clock/qcom,gcc-yupik.h

      - name: Pregatire config
        run: |
          set -e
          cd kernel
          mkdir -p out
          if file ../vili_defconfig | grep -qi utf-16; then
            iconv -f UTF-16LE -t UTF-8 ../vili_defconfig > out/.config
          else
            cp ../vili_defconfig out/.config
          fi
          sed -i 's/\r$//' out/.config
          sed -i '1s/^\xEF\xBB\xBF//' out/.config

          cat >> out/.config <<'EOF'

          # --- adaugari vili-nethunter-kernel ---
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH9K_HTC_DEBUGFS=y
          CONFIG_RTL8187=m
          CONFIG_EEPROM_93CX6=m
          CONFIG_RTC_LIB=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          CONFIG_OF_OVERLAY=y
          CONFIG_MODVERSIONS=n
          # --- sfarsit adaugari ---
          EOF

          echo "=== config pregatit: $(wc -l < out/.config) linii ==="
          grep -c '^CONFIG_' out/.config || true

      - name: Verificare config aplicat
        run: |
          set -e
          cd kernel
          export PATH=/usr/lib/llvm-14/bin:$PATH
          ARGS="ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          make O=out $ARGS olddefconfig
          echo "=== config final: $(wc -l < out/.config) linii ==="
          echo "--- verificari obligatorii ---"
          for opt in CONFIG_ATH9K_HTC CONFIG_RTL8187 CONFIG_RTC_LIB CONFIG_BUILD_ARM64_DT_OVERLAY; do
            if grep -q "^${opt}=" out/.config; then
              grep "^${opt}=" out/.config
            else
              echo "!!! LIPSA ${opt} !!!"
            fi
          done

      - name: Build kernel
        run: |
          set -e
          cd kernel
          export PATH=/usr/lib/llvm-14/bin:$PATH
          export ARCH=arm64
          export LC_ALL=C
          export KCFLAGS="-Wno-error -I$PWD/drivers/pinctrl -I$PWD/techpack/audio -I$PWD/drivers/soundwire"
          ARGS="ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"

          echo "clang: $(clang --version | head -1)"
          echo "nproc: $(nproc)"
          echo "=== incepe compilarea ==="
          make -j$(nproc) O=out $ARGS -k || true

          echo ""
          echo "=== verificare artefacte ==="
          ls -la out/arch/arm64/boot/Image 2>/dev/null || echo "LIPSA Image"
          ls -la out/arch/arm64/boot/dts/vendor/qcom/lahaina.dtb 2>/dev/null || echo "LIPSA lahaina.dtb"
          ls -la out/arch/arm64/boot/dts/vendor/qcom/vili-sm8350-overlay.dtbo 2>/dev/null || echo "LIPSA overlay vili"
          echo "--- module wireless ---"
          find out -name 'ath9k_htc.ko' -o -name 'rtl8187.ko' -o -name 'eeprom_93cx6.ko'
          echo "--- total .ko: $(find out -name '*.ko' | wc -l) ---"

      - name: Colectare artefacte
        run: |
          set -e
          mkdir -p artifact/modules
          cd kernel

          cp out/arch/arm64/boot/Image artifact/ 2>/dev/null || echo "fara Image"
          cp out/arch/arm64/boot/dts/vendor/qcom/lahaina*.dtb artifact/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/vendor/qcom/vili-sm8350-overlay.dtbo artifact/ 2>/dev/null || true

          find out -name '*.ko' -exec cp {} artifact/modules/ \; 2>/dev/null || true

          cd ..
          echo "=== continut artefact ==="
          ls -la artifact/
          echo "module: $(ls artifact/modules | wc -l)"
          echo "dtb/dtbо vili: $(ls artifact | grep -ci vili || true)"
          du -sh artifact/

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
